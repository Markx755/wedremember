</style><div class="guide"><h1>คู่มือใช้งาน STAR</h1><p>อธิบายทุกเมนูและทุกฟังก์ชันของโปรแกรม พร้อมภาพหน้าจอจริงจากเมนูของโปรแกรม (ข้อมูลในภาพเป็นตัวอย่าง)</p><div class="toc"><a data-g="g-start">เริ่มเร็ว</a><a data-g="g-how">หลักการทำงาน</a><a data-g="g-add">[1] เพิ่มบัญชี</a><a data-g="g-acc">[2] บัญชี & แอป</a><a data-g="g-set">[3] Setting</a><a data-g="g-run">[4] START</a><a data-g="g-tools">[5] เครื่องมือเสริม</a><a data-g="g-web">รีโมตเว็บ</a><a data-g="g-central">เซิร์ฟกลาง</a><a data-g="g-faq">แก้ปัญหา</a></div><section id="g-start"><h2>เริ่มเร็ว 5 ขั้น</h2><ol><li>ติดตั้ง (Termux): <code>pkg install python</code> แล้ว <code>pip install requests</code></li>
<li>เปิดโปรแกรม: <code>python Star.py</code> (ใช้ชื่อไฟล์ของคุณ) · เริ่มเฝ้าทันทีไม่ผ่านเมนู: <code>--auto</code> · เฝ้าบัญชีเดียว: <code>--only ชื่อบัญชี</code></li>
<li>เมนู <b>[1]</b> เพิ่มบัญชี (Quick Login หรือ Cookie)</li>

<li>ไม่ติด → ถ้าเปิด <b>hop</b> ของบัญชีนั้น จะสลับเซิร์ฟ · ยังไม่ได้ → <b>COOLDOWN</b> พัก 30 วินาที เพิ่มเท่าตัวสูงสุด 300 แล้ววนใหม่ ไม่เลิก</li>
<li>มี root: ถ้าแอปตายจริง (ไม่พบโปรเซส 3 ครั้งติด และพ้นช่วงเปิดแอป 90 วินาที) จะ rejoin ให้เอง</li></ul><div class='tw'><table><tr><th>สถานะ</th><th>ความหมาย</th></tr><tr><td><b>WATCH</b></td><td>อยู่ในเกม — เฝ้าปกติ</td></tr><tr><td><b>REJOIN</b></td><td>หลุดเกม กำลังกลับ (บอก ลอง n/3)</td></tr><tr><td><b>HOP</b></td><td>กำลังสลับเซิร์ฟ</td></tr><tr><td><b>COOLDOWN</b></td><td>กลับไม่ได้ พักก่อนวนใหม่</td></tr><tr><td><b>DEAD</b></td><td>cookie ตาย — เปลี่ยนที่ [2] → เลขบัญชี → [6]</td></tr><tr><td><b>NET</b></td><td>เน็ตหลุด รอเอง</td></tr><tr><td><b>INIT / OFF</b></td><td>เริ่มต้น / ถูกพัก</td></tr></table></div></section><section id="g-add"><h2>[1] เพิ่มบัญชี</h2><figure class="shot"><pre class="term"><span style="color:rgb(40,110,160)">├── </span><span style="color:rgb(64,196,255)">เพิ่มบัญชี</span><span style="color:rgb(40,110,160)"> ──────────────────────────────────</span>

<h3>[2] Cookie</h3><ul><li><code>a</code> วางเดี่ยว — วาง cookie ที่ขึ้นต้น <code>_|WARNING:-DO-NOT-SHARE-THIS…</code></li><li><code>b</code> ไฟล์ใน Download — พิมพ์แค่ชื่อไฟล์ เช่น <code>tes.txt</code> (หรือ <code>tes</code>) โปรแกรมหาใน <code>/sdcard/Download/</code> ให้ · รูปแบบบรรทัดละ <code>ชื่อ|cookie</code> · ต้องสั่ง <code>termux-setup-storage</code> ก่อนหนึ่งครั้ง</li>
<li><code>c</code> หลายไอดี — วางต่อกันได้หลายตัว</li><li><code>t</code> วิธีหา cookie</li></ul><div class="warn">⚠️ cookie คือกุญแจเข้าบัญชี ห้ามส่งให้ใคร · โปรแกรมเก็บในไฟล์ star_config.json (สิทธิ์เฉพาะเจ้าของ)</div></section><section id="g-acc"><h2>[2] บัญชี & แอป</h2><figure class="shot"><pre class="term"><span style="color:rgb(40,110,160)">├── </span><span style="color:rgb(64,196,255)">บัญชี &amp; แอป</span><span style="color:rgb(40,110,160)"> ───────────────────────────────</span>

 if(x=c("[data-bulk]")){const k=x.dataset.bulk;if(k=="clear"){sel.clear();render();return}if(k=="all"){online().forEach(f=>sel.add(f.id));render();return}const o={start:{cmd:"start"},stop:{cmd:"pause_all"},rejoin:{cmd:"kick_all"}}[k];await Promise.all([...sel].map(i=>cmd(o,i,1)));toast(`สั่ง ${k} ${sel.size} เครื่องแล้ว`);return}
 if(x=c("[data-ag]")){if(x.dataset.ag=="stop"){cmd({cmd:"autogrid_stop"});return}cmd({cmd:"autogrid_start",pattern:$("#ag_p").value.trim(),cols:+$("#ag_c").value,interval:+$("#ag_i").value,margin:+$("#ag_m").value});return}
 if(x=c("[data-c]")){cmd({cmd:x.dataset.c});return}
 if(x=c("[data-ht]")){cmd({cmd:"set_cfg",key:"hop_target",value:x.dataset.ht});return}
 if(x=c("[data-k]")){cmd({cmd:"set_cfg",key:x.dataset.k,value:$("#cf_"+x.dataset.k).value});return}
 if(x=c("[data-pi]")){cmd({cmd:"acc_set",id:x.dataset.pi,field:"place_id",value:document.querySelector(`[data-p="${x.dataset.pi}"]`).value.trim()});return}
 if(c("#pallb")){const v=$("#pall").value.trim(),f=dev(cur);if(!/^\d+$/.test(v)||!f||!f.data){toast("place id ต้องเป็นตัวเลข",1);return}Promise.all(f.data.accounts.map(a=>cmd({cmd:"acc_set",id:a.id,field:"place_id",value:v},cur,1))).then(()=>toast(`ตั้ง place ${v} ให้ทุกบัญชีแล้ว`));return}
 if(c("#cf_wh")){cmd({cmd:"set_cfg",key:"webhook",value:$("#cf_webhook").value.trim()});return}
 if(x=c("#cp")){navigator.clipboard.writeText(x.dataset.u+"/#t="+encodeURIComponent(T)).then(()=>toast("คัดลอกลิงก์แล้ว (มี token อย่าแชร์ต่อ)"));return}
 if(c("#sx")){closeSheet();return}
 if(x=c("#sok")){const txt=$("#ck").value;if(!txt.trim())return;x.disabled=true;const r=await cmd({cmd:"add_cookie",text:txt},x.dataset.dev);if(r&&r.ok)closeSheet();else x.disabled=false;return}
 if(c("#dtest")){const r=await api("/api/devices",{action:"test",...dv()});$("#derr").className=r.ok?"ok":"bad";$("#derr").textContent=r.msg;return}
 if(c("#dsave")){const r=await api("/api/devices",{action:"add",...dv()});if(r.ok){closeSheet();toast(r.msg);tick()}else{$("#derr").className="bad";$("#derr").textContent=r.msg}return}
 if(c("#fsx")){closeFs();return}
 if(x=c("[data-key]")){lvs({cmd:"input",kind:"key",key:x.dataset.key});return}
 if(c("#fss")&&$("#fst").value){lvs({cmd:"input",kind:"text",text:$("#fst").value});$("#fst").value="";return}
 if(c("#out")){if(confirm("ล้างรายการเครื่องทั้งหมดในเบราว์เซอร์นี้?")){DEVS=[];saveDevs();fleet=[];tick()}return}
 if(c("#login")){T=$("#tk").value.trim();LS.set("star_t",T);tick();return}
 if(t.id=="sh"){closeSheet()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.sel){t.checked?sel.add(t.dataset.sel):sel.delete(t.dataset.sel);render();return}
 if(t.dataset.t){cmd({cmd:"acc_set",id:t.dataset.i,field:t.dataset.t,value:t.checked});return}
 if(t.dataset.all){const f=dev(cur);if(!f||!f.data)return;Promise.all(f.data.accounts.map(x=>cmd({cmd:"acc_set",id:x.id,field:t.dataset.all,value:t.checked},cur,1))).then(()=>toast(`ตั้ง ${t.dataset.all} ทั้งหมดแล้ว`));return}
 if(t.id=="curdev"){cur=t.value;LS.set("star_cur",cur);render();return}
 if(t.id=="ah"){cmd({cmd:"set_cfg",key:"auto_hop",value:t.checked});return}
 if(t.id=="he"){cmd({cmd:"set_cfg",key:"hop_every",value:+t.value});return}
 if(t.id=="cf_wake"){cmd({cmd:"set_cfg",key:"wake",value:t.checked});return}
 if(t.id=="cf_shot"){cmd({cmd:"set_cfg",key:"report_shot",value:t.checked});return}
 if(t.id=="snd"){snd=t.checked;if(snd)beep();return}
 if(t.id=="lv"){lvl=t.value;render();return}
 if(t.id=="lrate"){liveMs=+t.value;LS.set("star_ms",liveMs);return}});
document.addEventListener("input",e=>{if(e.target.id=="he")$("#hev").textContent=e.target.value});
$("#tk").onkeydown=e=>{if(e.key=="Enter")$("#login").click()};
document.addEventListener("visibilitychange",syncLive);
let pd=null;const li=$("#fsimg");
li.addEventListener("pointerdown",e=>{pd={x:e.clientX,y:e.clientY,t:Date.now()};e.preventDefault()});
li.addEventListener("pointerup",e=>{if(!pd)return;const r=li.getBoundingClientRect(),f=(x,y)=>[(x-r.left)/r.width,(y-r.top)/r.height],a=f(pd.x,pd.y),b=f(e.clientX,e.clientY),mv=Math.hypot(e.clientX-pd.x,e.clientY-pd.y);
 lvs(mv<12?{cmd:"input",kind:"tap",x:a[0],y:a[1]}:{cmd:"input",kind:"swipe",x:a[0],y:a[1],x2:b[0],y2:b[1],ms:Math.min(800,Date.now()-pd.t+80)});pd=null});
render();tick();if(!DEVS.length)openDev();setInterval(()=>{if(T&&!document.hidden)tick()},3000);
</script></body></html>
